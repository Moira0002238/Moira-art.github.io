<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小說筆記本">
<meta name="theme-color" content="#efe8da">
<link rel="apple-touch-icon" href="icon.png">
<title>小說筆記本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f4eb; --side:#efe8da; --line:#ddd3c0; --ink:#2b2620; --mute:#8a7f6e; --accent:#8a3b2e; --accent-soft:#f1dfd6;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --k0:#ffe08a; --k1:#ffc2d1; --k2:#b9dcff; --k3:#c5efb8; --k4:#e2c8ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- screens ---------- */
.screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:440px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;box-shadow:0 6px 30px rgba(60,40,20,.06)}
.card h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 6px}
.card p{color:var(--mute);line-height:1.7;font-size:14.5px;margin:8px 0}
.card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#b3261e}
.btn.big{padding:12px 18px;font-size:15px;width:100%;margin-top:8px}
.linkbtn{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;font-size:14px}

/* ---------- layout ---------- */
#app{display:flex;height:100%;height:100dvh}
#side{width:310px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#main{flex:1;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.side-head{padding:16px 14px 10px;padding-top:max(16px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:600;letter-spacing:.04em}
.searchbox{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.searchbox .q{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:0 10px}
.searchbox .q:focus-within{border-color:var(--accent)}
.searchbox input{border:none;outline:none;background:transparent;padding:9px 6px;flex:1;min-width:0;font-size:15px}
.searchbox select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;font-size:13.5px}
.searchbox small{color:var(--mute);font-size:12px}
#tree{flex:1;overflow:auto;padding:4px 6px 12px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:2px;padding:5px 4px 5px calc(4px + var(--d,0) * 16px);border-radius:7px;cursor:pointer;user-select:none;-webkit-user-select:none;min-height:34px}
.row:hover{background:rgba(255,255,255,.55)}
.row.active{background:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.row .tw{width:22px;height:22px;border:none;background:none;padding:0;color:var(--mute);flex:none;font-size:12px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.row.folder>.nm{font-weight:600}
.row.d0>.nm{font-family:var(--serif);font-size:15.5px}
.row .wc{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none;margin-left:6px}
.row .more{border:none;background:none;width:28px;height:26px;border-radius:6px;color:var(--mute);flex:none;font-size:16px;line-height:1}
.row .more:hover{background:rgba(0,0,0,.06)}
.row.hint{color:var(--mute);font-size:12.5px;cursor:default;min-height:26px;padding-left:calc(30px + var(--d,0) * 16px)}
.side-foot{border-top:1px solid var(--line);padding:9px 12px;padding-bottom:max(9px,env(safe-area-inset-bottom));font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
.side-foot .tot{flex:1}
.side-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
.iconbtn{border:none;background:none;border-radius:7px;padding:4px 8px;color:var(--mute);font-size:15px}
.iconbtn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.empty{padding:28px 18px;color:var(--mute);font-size:14px;line-height:1.8;text-align:center}

/* ---------- main pages ---------- */
.topbar{position:sticky;top:0;z-index:5;background:rgba(248,244,235,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));min-height:48px}
.topbar .crumb{flex:1;min-width:0;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .crumb a{color:inherit;text-decoration:none;cursor:pointer}
.topbar .crumb a:hover{color:var(--accent)}
.savest{font-size:12px;color:var(--mute);white-space:nowrap}
.savest.warn{color:#b3261e}
.back{display:none;border:none;background:none;font-size:15px;color:var(--accent);padding:4px 4px 4px 0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex:none}
.seg button{border:none;background:none;padding:5px 11px;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.page{max-width:820px;margin:0 auto;padding:28px 24px 80px}
.sheet{max-width:760px;margin:0 auto;padding:26px 28px 120px}
.dtitle{width:100%;border:none;background:transparent;font-family:var(--serif);font-size:28px;font-weight:600;padding:4px 0;outline:none;border-bottom:1px dashed transparent}
.dtitle:focus{border-bottom-color:var(--line)}
.dcount{font-size:13px;color:var(--mute);margin:4px 0 22px}
.dcount b{color:var(--ink);font-variant-numeric:tabular-nums}
.text{font-family:var(--serif);font-size:18px;line-height:1.95;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;padding:0;margin:0}
.grow{display:grid}
.grow::after{content:attr(data-v) " ";visibility:hidden;white-space:pre-wrap}
.grow>textarea,.grow::after{grid-area:1/1/2/2;font-family:var(--serif);font-size:18px;line-height:1.95;letter-spacing:.02em;word-break:break-word;overflow-wrap:anywhere;padding:0 0 40vh;margin:0;border:none}
.grow>textarea{resize:none;overflow:hidden;background:transparent;outline:none;min-height:50vh}
.read{padding-bottom:40vh}
mark{border-radius:3px;padding:0 1px;color:inherit}
mark.k0{background:var(--k0)} mark.k1{background:var(--k1)} mark.k2{background:var(--k2)} mark.k3{background:var(--k3)} mark.k4{background:var(--k4)}
mark.cur{outline:2px solid var(--accent);outline-offset:1px}
.findbar{position:sticky;top:48px;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;font-size:13px}
.findbar .n{font-variant-numeric:tabular-nums;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:12.5px}
.chip.k0{background:var(--k0)} .chip.k1{background:var(--k1)} .chip.k2{background:var(--k2)} .chip.k3{background:var(--k3)} .chip.k4{background:var(--k4)}

h2.ptitle{font-family:var(--serif);font-size:30px;font-weight:600;margin:4px 0 14px;cursor:text}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:120px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.stat span{font-size:12.5px;color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #efe9dd;cursor:pointer}
.li:first-child{border-top:none}
.li:hover{background:#fbf8f2}
.li .ic{width:20px;text-align:center;color:var(--mute);flex:none}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .bar{width:90px;height:5px;background:#f0ebe0;border-radius:4px;overflow:hidden;flex:none}
.li .bar i{display:block;height:100%;background:#d6b9a8}
.li .wc{width:76px;text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}

/* search results */
.res{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.res-h{display:flex;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid #efe9dd;cursor:pointer}
.res-h:hover{background:#fbf8f2}
.res-h .nm{font-weight:600}
.res-h .path{font-size:12px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-h .cnt{font-size:12px;color:var(--accent);white-space:nowrap}
.snip{padding:9px 14px;font-family:var(--serif);font-size:15px;line-height:1.8;border-top:1px dashed #efe9dd;cursor:pointer}
.snip:first-of-type{border-top:none}
.snip:hover{background:#fbf8f2}
.snip .nl{color:#c9bda8;font-size:12px;margin:0 2px}
.more-n{padding:6px 14px 10px;font-size:12.5px;color:var(--mute)}
.sum{font-size:14px;color:var(--mute);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* menu / modal / toast */
#menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(40,30,20,.16);padding:5px;min-width:170px}
#menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 12px;border-radius:7px;font-size:14px}
#menu button:hover{background:var(--paper)}
#menu button.danger{color:#b3261e}
#menu hr{border:none;border-top:1px solid #efe9dd;margin:4px 0}
#modal{position:fixed;inset:0;z-index:60;background:rgba(40,30,20,.35);display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2);max-height:85vh;display:flex;flex-direction:column}
#modal h3{margin:0 0 8px;font-size:17px}
#modal p{margin:0 0 12px;color:var(--mute);font-size:14px;line-height:1.7;white-space:pre-line}
#modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;font-size:16px}
#modal .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#modal .opts{overflow:auto;margin-bottom:14px;border:1px solid var(--line);border-radius:8px}
#modal .opt{display:block;width:100%;text-align:left;border:none;border-top:1px solid #efe9dd;background:#fff;padding:9px 12px;font-size:14px}
#modal .opt:first-child{border-top:none}
#modal .opt:hover{background:var(--paper)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2620;color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;z-index:70;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#authbar{position:fixed;top:0;left:0;right:0;z-index:40;background:#fff4d6;border-bottom:1px solid #e8d49a;padding:9px 14px;padding-top:max(9px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;flex-wrap:wrap}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mute);font-size:14px;background:var(--paper);z-index:30}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  #side{position:fixed;inset:0;width:auto;border-right:none}
  #main{position:fixed;inset:0;background:var(--paper);transform:translateX(100%);transition:transform .22s ease;z-index:10}
  body.show-main #main{transform:none}
  .back{display:inline-flex}
  .sheet{padding:18px 18px 120px}
  .page{padding:20px 16px 80px}
  .dtitle{font-size:23px}
  .text,.grow>textarea,.grow::after{font-size:17px}
  .li .bar{display:none}
  .row{min-height:40px}
  .searchbox input{font-size:16px}
}
</style>
</head>
<body>

<!-- 設定畫面 -->
<div id="setup" class="screen hidden">
  <div class="card">
    <h1>小說筆記本</h1>
    <p>第一次使用要先填入 Google 的「用戶端 ID」（Client ID），讓網頁可以把資料存進你的 Google 雲端硬碟。</p>
    <input id="cidInput" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
    <button class="btn primary big" id="cidSave">儲存</button>
    <p style="margin-top:16px"><button class="linkbtn" id="toDemo">先看示範版（資料不會儲存）</button></p>
  </div>
</div>

<!-- 登入畫面 -->
<div id="login" class="screen hidden">
  <div class="card">
    <h1>小說筆記本</h1>
    <p>你的小說會存在自己的 Google 雲端硬碟「小說筆記本」資料夾裡，電腦和手機登入同一個帳號就會同步。</p>
    <button class="btn primary big" id="loginBtn">用 Google 帳號登入</button>
    <p id="loginErr" style="color:#b3261e"></p>
  </div>
</div>

<div id="loading" class="loading hidden"><div class="spin"></div><div id="loadingText">載入中…</div></div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="side-head">
      <div class="brand">
        <h1>小說筆記本</h1>
        <button class="btn" data-act="newbook">＋ 新書</button>
      </div>
      <div class="searchbox">
        <div class="q"><span style="color:var(--mute)">⌕</span><input id="q" type="search" placeholder="搜尋（多個關鍵字用空格隔開）" enterkeyhint="search"></div>
        <select id="scope"></select>
      </div>
    </div>
    <div id="tree"></div>
    <div class="side-foot">
      <span class="tot">全部 <b id="totalWc">0</b> 字</span>
      <span id="status"></span>
      <button class="iconbtn" data-act="sync" title="重新同步">⟳</button>
      <button class="iconbtn" data-act="sysmenu" title="更多">⋯</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="menu" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="authbar" class="hidden"><span>Google 連線已過期，剛寫的內容已暫存在這台裝置。</span><button class="btn primary" id="reauth">重新連線</button></div>
<input type="file" id="fileIn" multiple accept=".txt,.md,.docx,text/plain" class="hidden">

<script>
/* =========================================================
   設定：Google Cloud 的 OAuth 用戶端 ID
   ========================================================= */
const CLIENT_ID = '627970978437-l26i0mmkub7u6o79q122pg7t94k7hakp.apps.googleusercontent.com';

const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FOLDER_MIME = 'application/vnd.google-apps.folder';
const DEMO = new URLSearchParams(location.search).has('demo');
const MAMMOTH = 'https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js';

/* ---------------- 小工具 ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n || 0).toLocaleString('zh-TW');
const CJK = /[㐀-䶿一-鿿豈-﫿぀-ヿ가-힯\u{20000}-\u{2fa1f}]/gu;
const WORD = /[A-Za-z0-9]+(?:['’][A-Za-z]+)*/g;
/** 字數：中日韓文字每字算 1，英文單字/數字每組算 1，標點和空白不算 */
function countWords(t) {
  if (!t) return 0;
  const c = (t.match(CJK) || []).length;
  const w = (t.replace(CJK, ' ').match(WORD) || []).length;
  return c + w;
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => {
    while (i < items.length) { const it = items[i++]; await fn(it); }
  }));
}
const CN = {'零':0,'〇':0,'一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnNum(s) {
  if (/^\d+$/.test(s)) return +s;
  let total = 0, cur = 0;
  for (const ch of s) {
    if (ch in CN) cur = CN[ch];
    else if (ch === '十') { total += (cur || 1) * 10; cur = 0; }
    else if (ch === '百') { total += (cur || 1) * 100; cur = 0; }
    else if (ch === '千') { total += (cur || 1) * 1000; cur = 0; }
  }
  return total + cur;
}
/** 匯入時排序用：「第十二章」→ 12 */
function chapterKey(name) {
  const m = name.match(/第\s*([0-9零〇一二兩两三四五六七八九十百千]+)\s*[章回節节卷部集話话篇]/);
  return m ? cnNum(m[1]) : null;
}
function toCn(n) {
  const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  let out = '', zero = false;
  for (const [v, u] of [[1000, '千'], [100, '百'], [10, '十'], [1, '']]) {
    const q = Math.floor(n / v) % 10;
    if (q) { if (zero && out) out += '零'; out += d[q] + u; zero = false; } else if (out) zero = true;
  }
  return out;
}
/** 依照同一層最後一個「第N章」推測下一章的名字，沿用國字或數字的寫法 */
function suggestChapterName(pid) {
  let best = null;
  for (const c of node(pid).children) {
    const n = node(c); if (n.type !== 'doc') continue;
    const m = dispName(n).match(/第\s*([0-9零〇一二兩两三四五六七八九十百千]+)\s*([章回節节話话篇])/);
    if (m && (!best || cnNum(m[1]) >= best.k)) best = {k: cnNum(m[1]), digit: /^\d+$/.test(m[1]), unit: m[2]};
  }
  if (!best) return '第一章';
  const k = best.k + 1;
  return `第${best.digit ? k : toCn(k)}${best.unit}`;
}
function sortFilesByChapter(files) {
  return files.slice().sort((a, b) => {
    const ka = chapterKey(a.name), kb = chapterKey(b.name);
    if (ka != null && kb != null && ka !== kb) return ka - kb;
    return a.name.localeCompare(b.name, 'zh-Hant', {numeric: true});
  });
}

/* ---------------- 本機暫存（IndexedDB） ---------------- */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DEMO ? 'novel-notebook-demo' : 'novel-notebook', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('cache'); r.result.createObjectStore('drafts'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  const safe = p => p.catch(() => undefined);
  return {
    get: (s, k) => safe(tx(s, 'readonly', st => st.get(k))),
    set: (s, k, v) => safe(tx(s, 'readwrite', st => st.put(v, k))),

class AuthError extends Error {}

const clientId = () => CLIENT_ID || localStorage.getItem('nn_client_id') || '';
try { const t = JSON.parse(localStorage.getItem('nn_tok') || 'null'); if (t && t.tokenExp > Date.now()) { token = t.token; tokenExp = t.tokenExp; } } catch {}
function loadScript(src) {

/* ---------------- Google 雲端硬碟 API ---------------- */
const API = 'https://www.googleapis.com/drive/v3/files';
const UP = 'https://www.googleapis.com/upload/drive/v3/files';
const FIELDS = 'id,name,mimeType,parents,appProperties,modifiedTime,trashed';
async function gfetch(url, opts = {}, tries = 0) {
  if (!token || Date.now() > tokenExp) throw new AuthError('expired');
  let r;
  try { r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: 'Bearer ' + token}}); }
  catch (e) { if (tries < 3) { await sleep(800 * 2 ** tries); return gfetch(url, opts, tries + 1); } throw new Error('網路連線失敗'); }
  if (r.status === 401) { token = null; localStorage.removeItem('nn_tok'); throw new AuthError('401'); }
  if ((r.status === 429 || r.status >= 500 || r.status === 403) && tries < 3) {
    if (r.status !== 403 || /rate|quota/i.test(await r.clone().text())) { await sleep(1000 * 2 ** tries); return gfetch(url, opts, tries + 1); }
  }
  if (!r.ok) throw new Error(`雲端硬碟錯誤 ${r.status}：${(await r.text()).slice(0, 160)}`);
  return r;
}
const realDrive = {
  async list() {
    const out = []; let pageToken = '';
    do {
      const u = new URL(API);
      u.searchParams.set('q', 'trashed=false');
      u.searchParams.set('fields', `nextPageToken,files(${FIELDS})`);
      u.searchParams.set('pageSize', '1000');
      if (pageToken) u.searchParams.set('pageToken', pageToken);
      const j = await (await gfetch(u)).json();
      out.push(...j.files); pageToken = j.nextPageToken;
    } while (pageToken);
    return out;
  },
  async getText(id) { return (await gfetch(`${API}/${id}?alt=media`)).text(); },
  async getMeta(id) { return (await gfetch(`${API}/${id}?fields=${FIELDS}`)).json(); },
  async create(meta, text) {
    if (text == null) return (await gfetch(`${API}?fields=${FIELDS}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(meta)})).json();
    const b = 'nnb' + Math.random().toString(36).slice(2) + Date.now();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;
    return (await gfetch(`${UP}?uploadType=multipart&fields=${FIELDS}`, {method: 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + b}, body})).json();
  },
  async updateText(id, text) {
    return (await gfetch(`${UP}/${id}?uploadType=media&fields=${FIELDS}`, {method: 'PATCH', headers: {'Content-Type': 'text/plain; charset=UTF-8'}, body: text})).json();
  },
  async patch(id, meta, addParent, removeParent) {
    let u = `${API}/${id}?fields=${FIELDS}`;
    if (addParent) u += `&addParents=${addParent}&removeParents=${removeParent}`;
    return (await gfetch(u, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(meta)})).json();
  },
};

async function loadAll(progress) {
  const files = await drive.list();
  let root = files.find(f => f.appProperties && f.appProperties.nn === 'root');
  if (!root) { root = await drive.create({name: '小說筆記本', mimeType: FOLDER_MIME, appProperties: {nn: 'root'}}); }
  S.rootId = root.id;
  const old = S.nodes, nodes = new Map();
  nodes.set(root.id, {id: root.id, type: 'folder', name: root.name, parentId: null, order: 0, children: []});
  for (const f of files) {
    const nn = f.appProperties && f.appProperties.nn;
    if (nn !== 'folder' && nn !== 'doc') continue;
    const o = old.get(f.id);
    nodes.set(f.id, {
      id: f.id, type: nn, name: f.name, parentId: (f.parents || [])[0],
      order: Number(f.appProperties.order || 0), modifiedTime: f.modifiedTime, children: [],
      text: o ? o.text : null, wc: o ? o.wc : 0, loadedTime: o ? o.loadedTime : null, base: o ? o.base : f.modifiedTime,
    });
  }
  // 本機還沒存上去、但雲端清單裡沒有的（例如別台裝置刪掉了）→ 保留，存檔時會救回
  for (const id of S.dirty) if (!nodes.has(id) && old.has(id)) nodes.set(id, {...old.get(id), children: [], resurrect: true});
  for (const n of nodes.values()) {
    if (n.id === S.rootId) continue;
    const p = nodes.get(n.parentId);
    if (p && p.type === 'folder') p.children.push(n.id);
  }
  const cmp = (a, b) => { const A = nodes.get(a), B = nodes.get(b); return A.order - B.order || A.name.localeCompare(B.name, 'zh-Hant', {numeric: true}); };
  for (const n of nodes.values()) n.children.sort(cmp);
  S.nodes = nodes;

  const need = [];
  for (const n of nodes.values()) {
    if (n.type !== 'doc' || S.dirty.has(n.id)) continue;
    if (n.text != null && n.loadedTime === n.modifiedTime) continue;
    const c = await idb.get('cache', n.id);
    if (c && c.modifiedTime === n.modifiedTime) { setText(n, c.text); n.loadedTime = n.base = n.modifiedTime; continue; }
    need.push(n);
  }
  let done = 0;
  if (need.length && progress) progress(0, need.length);
  await pool(need, 6, async n => {
    const t = await drive.getText(n.id);
    if (!S.dirty.has(n.id)) { setText(n, t); n.loadedTime = n.base = n.modifiedTime; idb.set('cache', n.id, {modifiedTime: n.modifiedTime, text: t}); }
    done++; if (progress) progress(done, need.length);
  });
  S.lastSync = Date.now();
}

  }
}

let searchTimer = null;

function runSearch() {
  const kws = keywords();
  if (!kws.length) { if (S.view === 'search') { S.view = 'node'; renderMain(); renderTree(); } return; }
  S.view = 'search'; document.body.classList.add('show-main');

function renderSearch() {
  const kws = keywords(), scope = $('#scope').value;
  const docs = scope === 'all' ? docsUnder(S.rootId) : docsUnder(scope);
  const re = hlRegex(kws), map = new Map(kws.map((k, i) => [k.toLowerCase(), i % 5]));
  const perKw = kws.map(() => 0);
  const results = [];
  for (const d of docs) {
    const t = d.text || '', hits = []; let m; re.lastIndex = 0;
    while ((m = re.exec(t))) { if (!m[0]) { re.lastIndex++; continue; } hits.push({pos: m.index, len: m[0].length}); perKw[kws.findIndex(k => k.toLowerCase() === m[0].toLowerCase())]++; }
    const titleHit = kws.some(k => dispName(d).toLowerCase().includes(k.toLowerCase()));
    if (hits.length || titleHit) results.push({d, hits, titleHit});
  }
  const total = perKw.reduce((a, b) => a + b, 0);
  const SNIPS = 4;
  const snipHtml = (d, hits) => {
    const t = d.text || '', wins = [];
    for (const h of hits) {
      const s = Math.max(0, h.pos - 28), e = Math.min(t.length, h.pos + h.len + 48);
      const last = wins[wins.length - 1];
      if (last && s <= last.e) last.e = Math.max(last.e, e); else wins.push({s, e, pos: h.pos});
    }
    const shown = wins.slice(0, SNIPS);
    return shown.map(w => {
      const piece = t.slice(w.s, w.e);
      const html = highlightHtml(piece, kws).replace(/\n+/g, '<span class="nl">↵</span>');
      return `<div class="snip" data-hit="${d.id}" data-pos="${w.pos}">${w.s > 0 ? '…' : ''}${html}${w.e < t.length ? '…' : ''}</div>`;
    }).join('') + (wins.length > SNIPS ? `<div class="more-n">還有 ${wins.length - SNIPS} 段，點標題看全文</div>` : '');
  };
  const scopeName = scope === 'all' ? '全部作品' : `《${esc(node(scope).name)}》`;
  $('#main').innerHTML = `
  <div class="topbar"><button class="back" data-act="back">‹ 目錄</button><div class="crumb">搜尋 ・ ${scopeName}</div><span class="savest"></span></div>
  <div class="page">
    <div class="sum">${kws.map((k, i) => `<span class="chip k${i % 5}">${esc(k)} ${perKw[i]}</span>`).join('')}
      <span>共 ${total} 處，在 ${results.length} 篇文件裡</span></div>
    ${results.length ? results.map(({d, hits, titleHit}) => `
      <div class="res">
        <div class="res-h" data-hit="${d.id}" data-pos="${hits[0] ? hits[0].pos : ''}">
          <span class="nm">${highlightHtml(dispName(d), kws)}</span>
          <span class="path">${esc([...ancestors(d.id)].map(a => a.name).join(' › '))}</span>
          <span class="cnt">${hits.length ? hits.length + ' 處' : '標題符合'}</span>
        </div>
        ${snipHtml(d, hits)}
      </div>`).join('') : `<div class="empty">在${scopeName}裡找不到「${esc(kws.join(' '))}」</div>`}
  </div>`;
  setStatus($('#status').textContent);
}

async function actDelete(id) {
  const n = node(id), cnt = docsUnder(id).length;
  const ok = await confirmDlg(`刪除「${dispName(n)}」？`,
    (n.type === 'folder' ? `裡面的 ${cnt} 篇文件也會一起刪除。\n` : '') + '會移到 Google 雲端硬碟的垃圾桶，30 天內都可以從雲端硬碟救回來。', '刪除', true);
  if (ok) await trashNode(id);
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#menu') && !e.target.closest('[data-act="menu"]') && !e.target.closest('[data-act="sysmenu"]')) hideMenu();
  const actEl = e.target.closest('[data-act]');
  const row = e.target.closest('#tree .row[data-id]');
  if (actEl) {
    const act = actEl.dataset.act, id = actEl.dataset.id || (row && row.dataset.id);
    if (act === 'toggle') { const n = node(id); if (n.type === 'folder') { S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); saveExpanded(); renderTree(); } else openNode(id); return; }
    if (act === 'menu') { e.stopPropagation(); showMenu(actEl, nodeMenu(id)); return; }
    if (act === 'newbook') return run(actNewBook);
    if (act === 'newdoc') return run(() => actNewDoc(id));
    if (act === 'newfolder') return run(() => actNewFolder(id));
    if (act === 'import') return actImport(id);
    if (act === 'download') return downloadTxt(id);
    if (act === 'rename') return run(() => actRename(id));
    if (act === 'back') { document.body.classList.remove('show-main'); return; }
    if (act === 'mode') return switchMode(actEl.dataset.m);
    if (act === 'hlnext') { S.hlIndex++; return focusMark(true); }
    if (act === 'hlprev') { S.hlIndex--; return focusMark(true); }
    if (act === 'hlclear') { S.hl = null; return renderMain(); }
    if (act === 'sync') { setStatus('同步中…'); return run(async () => { await flush(); await sync(true); toast('已和雲端硬碟同步'); }); }
    if (act === 'sysmenu') {
      e.stopPropagation();
      const items = [{label: '下載全部作品（txt 備份）', fn: () => downloadTxt(S.rootId)}];
      if (DEMO) items.push({label: '離開示範版', fn: () => { location.href = location.pathname; }});
      else items.push({label: '登出', fn: () => { localStorage.removeItem('nn_tok'); if (token && window.google) google.accounts.oauth2.revoke(token, () => {}); location.reload(); }});
      return showMenu(actEl, items);
    }
  }
  if (row) { openNode(row.dataset.id); return; }
  const op = e.target.closest('[data-open]'); if (op) { openNode(op.dataset.open); return; }
  const hit = e.target.closest('[data-hit]');
  if (hit) {
    S.hl = keywords(); S.view = 'node';
    openNode(hit.dataset.hit, {mode: 'read', keepHl: true, pos: hit.dataset.pos === '' ? null : +hit.dataset.pos});
  }
});
$('#q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 250); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch(); e.target.blur(); } });
$('#scope').addEventListener('change', () => { if (keywords().length) runSearch(); });
$('#fileIn').addEventListener('change', e => { if (e.target.files.length) run(() => importFiles(e.target.files)); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); clearTimeout(saveTimer); flush(); }
  if (e.key === 'Escape') hideMenu();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (S.dirty.size) { clearTimeout(saveTimer); flush(); } }
  else if (S.rootId) sync();
});
window.addEventListener('beforeunload', e => { if (S.dirty.size) { flush(); e.preventDefault(); e.returnValue = ''; } });
$('#reauth').addEventListener('click', () => run(async () => {
  await requestToken(); $('#authbar').classList.add('hidden'); await flush(); await sync(true);
}));

/* ---------------- 啟動 ---------------- */
function show(id) { for (const s of ['setup', 'login', 'loading', 'app']) $('#' + s).classList.toggle('hidden', s !== id); }
async function start() {
  show('loading');
  try {
    await loadAll((d, t) => { $('#loadingText').textContent = `從雲端硬碟載入中… ${d} / ${t}`; });
  } catch (e) {
    if (e instanceof AuthError) { show('login'); return; }
    show('login'); $('#loginErr').textContent = '載入失敗：' + e.message; return;
  }
  await restoreDrafts();
  show('app');
  renderScope(); renderTree();
  const last = localStorage.getItem(DEMO ? 'nn_last_demo' : 'nn_last');
  if (last && node(last)) { openNode(last); if (innerWidth <= 820) document.body.classList.remove('show-main'); }
  else renderMain();
  if (!S.dirty.size) setStatus(DEMO ? '示範版' : '已同步');
  setInterval(() => { if (document.visibilityState === 'visible' && !S.dirty.size) sync(); }, 60000);
}
(async function init() {
  $('#toDemo').onclick = () => { location.search = '?demo'; };
  $('#cidSave').onclick = () => { const v = $('#cidInput').value.trim(); if (v) { localStorage.setItem('nn_client_id', v); location.reload(); } };
  if (DEMO) return start();
  if (!clientId()) return show('setup');
  try { await initAuth(); } catch (e) { show('login'); $('#loginErr').textContent = e.message; return; }
  $('#loginBtn').onclick = () => run(async () => {
    $('#loginErr').textContent = '';
    try { await requestToken(); start(); } catch (e) { $('#loginErr').textContent = '登入沒有完成：' + e.message; }
  });
  if (token) start(); else show('login');
})();
</script>
